<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For You, My Love</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        position: fixed;
        width: 100%;
      }

      body {
        background: radial-gradient(
            circle at 20% 80%,
            rgba(120, 119, 198, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(255, 119, 198, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 40% 40%,
            rgba(120, 219, 255, 0.2) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #0f0c29 0%, #24243e 35%, #302b63 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        font-family: 'Dancing Script', cursive;
      }

      /* Starry background */
      .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle 3s ease-in-out infinite alternate;
      }

      .star:nth-child(1) {
        width: 2px;
        height: 2px;
        top: 20%;
        left: 20%;
        animation-delay: 0s;
      }
      .star:nth-child(2) {
        width: 1px;
        height: 1px;
        top: 30%;
        left: 70%;
        animation-delay: 0.5s;
      }
      .star:nth-child(3) {
        width: 2px;
        height: 2px;
        top: 60%;
        left: 10%;
        animation-delay: 1s;
      }
      .star:nth-child(4) {
        width: 1px;
        height: 1px;
        top: 80%;
        left: 80%;
        animation-delay: 1.5s;
      }
      .star:nth-child(5) {
        width: 2px;
        height: 2px;
        top: 10%;
        left: 50%;
        animation-delay: 2s;
      }
      .star:nth-child(6) {
        width: 1px;
        height: 1px;
        top: 40%;
        left: 90%;
        animation-delay: 0.3s;
      }
      .star:nth-child(7) {
        width: 1px;
        height: 1px;
        top: 70%;
        left: 30%;
        animation-delay: 1.8s;
      }
      .star:nth-child(8) {
        width: 2px;
        height: 2px;
        top: 15%;
        left: 85%;
        animation-delay: 2.2s;
      }

      @keyframes twinkle {
        0% {
          opacity: 0.3;
          transform: scale(1);
        }
        100% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      /* Enhanced floating hearts */
      .hearts-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        overflow: hidden;
        z-index: 2;
      }

      .heart {
        top: -20px;
        position: absolute;
        font-size: 20px;
        animation: float 12s linear infinite;
        will-change: transform;
        filter: drop-shadow(0 0 6px rgba(255, 182, 193, 0.4));
      }

      .heart:nth-child(odd) {
        color: rgba(255, 182, 193, 0.4);
      }

      .heart:nth-child(even) {
        color: rgba(255, 140, 180, 0.3);
      }

      .heart:nth-child(1) {
        left: 10%;
        animation-delay: 0s;
        font-size: 18px;
      }
      .heart:nth-child(2) {
        left: 20%;
        animation-delay: 2s;
        font-size: 22px;
      }
      .heart:nth-child(3) {
        left: 30%;
        animation-delay: 4s;
        font-size: 16px;
      }
      .heart:nth-child(4) {
        left: 40%;
        animation-delay: 6s;
        font-size: 24px;
      }
      .heart:nth-child(5) {
        left: 50%;
        animation-delay: 8s;
        font-size: 20px;
      }
      .heart:nth-child(6) {
        left: 60%;
        animation-delay: 10s;
        font-size: 18px;
      }
      .heart:nth-child(7) {
        left: 70%;
        animation-delay: 3s;
        font-size: 26px;
      }
      .heart:nth-child(8) {
        left: 80%;
        animation-delay: 5s;
        font-size: 14px;
      }

      @keyframes float {
        0% {
          transform: translateY(110vh) rotate(0deg) scale(0.8);
          opacity: 0;
        }
        10% {
          opacity: 0.8;
          transform: translateY(100vh) rotate(45deg) scale(1);
        }
        90% {
          opacity: 0.6;
          transform: translateY(-5vh) rotate(315deg) scale(0.9);
        }
        100% {
          transform: translateY(-10vh) rotate(360deg) scale(0.7);
          opacity: 0;
        }
      }

      /* Magical particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
      }

      .particle {
        top: -5px;
        position: absolute;
        width: 4px;
        height: 4px;
        background: radial-gradient(circle, #fff, transparent);
        border-radius: 50%;
        animation: drift 15s linear infinite;
      }

      .particle:nth-child(1) {
        left: 5%;
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        left: 15%;
        animation-delay: 3s;
      }
      .particle:nth-child(3) {
        left: 25%;
        animation-delay: 6s;
      }
      .particle:nth-child(4) {
        left: 35%;
        animation-delay: 9s;
      }
      .particle:nth-child(5) {
        left: 45%;
        animation-delay: 12s;
      }
      .particle:nth-child(6) {
        left: 55%;
        animation-delay: 2s;
      }
      .particle:nth-child(7) {
        left: 65%;
        animation-delay: 5s;
      }
      .particle:nth-child(8) {
        left: 75%;
        animation-delay: 8s;
      }
      .particle:nth-child(9) {
        left: 85%;
        animation-delay: 11s;
      }
      .particle:nth-child(10) {
        left: 95%;
        animation-delay: 14s;
      }

      @keyframes drift {
        0% {
          transform: translateY(100vh) translateX(0px);
          opacity: 0;
        }
        10% {
          opacity: 0.7;
        }
        90% {
          opacity: 0.3;
        }
        100% {
          transform: translateY(-10vh) translateX(50px);
          opacity: 0;
        }
      }

      .container {
        text-align: center;
        z-index: 10;
        position: relative;
        filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.3));
      }

      .rose-container {
        position: relative;
        width: 350px;
        height: 450px;
        margin: 0 auto 60px;
      }

      /* Enhanced stem with gradient and glow */
      .stem {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 8px;
        height: 220px;
        background: linear-gradient(to bottom, #2d5016, #4a7c59, #1a3d0f);
        border-radius: 4px;
        transform: translateX(-50%);
        animation: growStem 2.5s ease-out;
        box-shadow: 0 0 10px rgba(74, 124, 89, 0.4),
          inset 2px 0 4px rgba(255, 255, 255, 0.1);
      }

      /* Enhanced leaves with better positioning */
      .leaf {
        position: absolute;
        width: 35px;
        height: 18px;
        background: linear-gradient(45deg, #2d5016, #4a7c59, #5d8f3a);
        border-radius: 0 100% 0 100%;
        bottom: 90px;
        left: 42%;
        transform: rotate(-45deg);
        animation: growLeaf 2.8s ease-out 1s both;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .leaf:nth-child(3) {
        bottom: 140px;
        left: 58%;
        transform: rotate(45deg);
        animation-delay: 1.3s;
        width: 30px;
        height: 15px;
      }

      .leaf:nth-child(4) {
        bottom: 110px;
        left: 48%;
        transform: rotate(-15deg);
        animation-delay: 1.6s;
        width: 25px;
        height: 12px;
      }

      /* More elaborate rose bloom */
      .rose-bloom {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 140px;
        filter: drop-shadow(0 0 15px rgba(255, 107, 157, 0.4));
      }

      .petal {
        position: absolute;
        border-radius: 20px 20px 5px 5px;
        transform-origin: center bottom;
        box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2);
      }

      /* Outer ring petals */
      .petal-1 {
        width: 45px;
        height: 65px;
        background: linear-gradient(45deg, #ff6b9d, #ff8fab, #ffacc1);
        top: 5px;
        left: 47px;
        transform: rotate(-25deg) scale(0);
        animation: bloomPetal 1.8s ease-out 3s both;
      }

      .petal-2 {
        width: 42px;
        height: 62px;
        background: linear-gradient(45deg, #ff8fab, #ffacc1, #ffc2d4);
        top: 25px;
        left: 70px;
        transform: rotate(15deg) scale(0);
        animation: bloomPetal 1.8s ease-out 3.3s both;
      }

      .petal-3 {
        width: 44px;
        height: 64px;
        background: linear-gradient(45deg, #ffacc1, #ffc2d4, #ffcccb);
        top: 55px;
        left: 65px;
        transform: rotate(55deg) scale(0);
        animation: bloomPetal 1.8s ease-out 3.6s both;
      }

      .petal-4 {
        width: 46px;
        height: 66px;
        background: linear-gradient(45deg, #ffc2d4, #ffcccb, #ff8fab);
        top: 75px;
        left: 30px;
        transform: rotate(115deg) scale(0);
        animation: bloomPetal 1.8s ease-out 3.9s both;
      }

      .petal-5 {
        width: 43px;
        height: 63px;
        background: linear-gradient(45deg, #ffcccb, #ff8fab, #ff6b9d);
        top: 55px;
        left: 5px;
        transform: rotate(155deg) scale(0);
        animation: bloomPetal 1.8s ease-out 4.2s both;
      }

      .petal-6 {
        width: 45px;
        height: 65px;
        background: linear-gradient(45deg, #ff8fab, #ff6b9d, #ff1744);
        top: 15px;
        left: 15px;
        transform: rotate(-65deg) scale(0);
        animation: bloomPetal 1.8s ease-out 4.5s both;
      }

      /* Middle ring petals */
      .petal-inner {
        width: 30px;
        height: 40px;
        border-radius: 15px 15px 3px 3px;
      }

      .petal-7 {
        background: linear-gradient(45deg, #ff1744, #ff6b9d, #c51162);
        top: 35px;
        left: 40px;
        transform: rotate(-15deg) scale(0);
        animation: bloomPetal 1.2s ease-out 5s both;
      }

      .petal-8 {
        background: linear-gradient(45deg, #ff6b9d, #ff1744, #ad1457);
        top: 42px;
        left: 55px;
        transform: rotate(25deg) scale(0);
        animation: bloomPetal 1.2s ease-out 5.3s both;
      }

      .petal-9 {
        background: linear-gradient(45deg, #ff1744, #c51162, #880e4f);
        top: 50px;
        left: 45px;
        transform: rotate(65deg) scale(0);
        animation: bloomPetal 1.2s ease-out 5.6s both;
      }

      .petal-10 {
        background: linear-gradient(45deg, #c51162, #ad1457, #ff1744);
        top: 48px;
        left: 30px;
        transform: rotate(105deg) scale(0);
        animation: bloomPetal 1.2s ease-out 5.9s both;
      }

      /* Inner core petals */
      .petal-core {
        width: 20px;
        height: 25px;
        border-radius: 10px 10px 2px 2px;
      }

      .petal-11 {
        background: linear-gradient(45deg, #8e24aa, #c51162, #ff1744);
        top: 42px;
        left: 42px;
        transform: rotate(0deg) scale(0);
        animation: bloomPetal 1s ease-out 6.5s both;
      }

      .petal-12 {
        background: linear-gradient(45deg, #4a148c, #8e24aa, #c51162);
        top: 46px;
        left: 50px;
        transform: rotate(60deg) scale(0);
        animation: bloomPetal 1s ease-out 6.8s both;
      }

      /* Enhanced center */
      .center {
        position: absolute;
        top: 50px;
        left: 50px;
        width: 18px;
        height: 18px;
        background: radial-gradient(circle, #4a148c, #1a0e42, #000);
        border-radius: 50%;
        transform: scale(0);
        animation: bloomCenter 1s ease-out 7.5s both;
        box-shadow: 0 0 8px rgba(74, 20, 140, 0.6),
          inset 0 2px 4px rgba(255, 255, 255, 0.1);
      }

      /* Enhanced text with glow effects */
      .romantic-text {
        font-family: 'Great Vibes', cursive;
        font-size: 3.2rem;
        font-weight: 400;
        background: linear-gradient(45deg, #ff8fab, #ffc2d4, #ff6b9d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
        transform: translateY(40px);
        animation: fadeInText 3s ease-out 8s both;
        text-shadow: 0 0 20px rgba(255, 139, 171, 0.5);
        line-height: 1.3;
        filter: drop-shadow(0 0 10px rgba(255, 139, 171, 0.4));
      }

      .subtitle {
        font-family: 'Dancing Script', cursive;
        font-size: 1.8rem;
        background: linear-gradient(45deg, #ffacc1, #ffc2d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
        margin-top: 25px;
        animation: fadeInText 2.5s ease-out 9s both;
        filter: drop-shadow(0 0 8px rgba(255, 172, 193, 0.3));
      }

      /* Animation keyframes */
      @keyframes growStem {
        from {
          height: 0;
          opacity: 0.7;
        }
        to {
          height: 220px;
          opacity: 1;
        }
      }

      @keyframes growLeaf {
        from {
          transform: rotate(-45deg) scale(0);
          opacity: 0;
        }
        50% {
          transform: rotate(-50deg) scale(1.1);
          opacity: 0.8;
        }
        to {
          transform: rotate(-45deg) scale(1);
          opacity: 1;
        }
      }

      @keyframes bloomPetal {
        0% {
          transform: rotate(var(--rotation, 0deg)) scale(0);
          opacity: 0;
        }
        30% {
          transform: rotate(calc(var(--rotation, 0deg) - 15deg)) scale(1.2);
          opacity: 0.7;
        }
        100% {
          transform: rotate(var(--rotation, 0deg)) scale(1);
          opacity: 1;
        }
      }

      .petal-1 {
        --rotation: -25deg;
      }
      .petal-2 {
        --rotation: 15deg;
      }
      .petal-3 {
        --rotation: 55deg;
      }
      .petal-4 {
        --rotation: 115deg;
      }
      .petal-5 {
        --rotation: 155deg;
      }
      .petal-6 {
        --rotation: -65deg;
      }
      .petal-7 {
        --rotation: -15deg;
      }
      .petal-8 {
        --rotation: 25deg;
      }
      .petal-9 {
        --rotation: 65deg;
      }
      .petal-10 {
        --rotation: 105deg;
      }
      .petal-11 {
        --rotation: 0deg;
      }
      .petal-12 {
        --rotation: 60deg;
      }

      @keyframes bloomCenter {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        50% {
          transform: scale(1.3);
          opacity: 0.8;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes fadeInText {
        0% {
          opacity: 0;
          transform: translateY(40px) scale(0.9);
        }
        50% {
          opacity: 0.7;
          transform: translateY(10px) scale(1.02);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Enhanced sparkle effects */
      .sparkles-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 8;
      }

      .sparkle {
        position: absolute;
        font-size: 14px;
        opacity: 0;
        animation: sparkle 4s ease-in-out infinite;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
      }

      .sparkle:nth-child(1) {
        top: 15%;
        left: 15%;
        animation-delay: 8s;
        color: #fff;
      }

      .sparkle:nth-child(2) {
        top: 25%;
        right: 15%;
        animation-delay: 8.5s;
        color: #ff8fab;
      }

      .sparkle:nth-child(3) {
        bottom: 25%;
        left: 10%;
        animation-delay: 9s;
        color: #ffc2d4;
      }

      .sparkle:nth-child(4) {
        bottom: 20%;
        right: 10%;
        animation-delay: 9.5s;
        color: #fff;
      }

      .sparkle:nth-child(5) {
        top: 40%;
        left: 5%;
        animation-delay: 10s;
        color: #ffacc1;
      }

      .sparkle:nth-child(6) {
        top: 60%;
        right: 5%;
        animation-delay: 10.5s;
        color: #ff6b9d;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.3) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.2) rotate(180deg);
        }
      }

      /* Interactive click sparkle */
      .click-sparkle {
        position: fixed;
        pointer-events: none;
        z-index: 100;
        animation: clickSparkle 1.5s ease-out forwards;
        font-size: 24px;
        filter: drop-shadow(0 0 6px currentColor);
      }

      @keyframes clickSparkle {
        0% {
          opacity: 1;
          transform: scale(0) rotate(0deg);
        }
        30% {
          opacity: 1;
          transform: scale(1.5) rotate(120deg);
        }
        100% {
          opacity: 0;
          transform: scale(0.3) rotate(360deg);
        }
      }

      /* Responsive design */
      @media (max-width: 768px) {
        .rose-container {
          width: 280px;
          height: 380px;
          margin-bottom: 40px;
        }

        .romantic-text {
          font-size: 2.5rem;
        }

        .subtitle {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="stars">
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
      <div class="star"></div>
    </div>

    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <div class="hearts-container">
      <div class="heart">♥</div>
      <div class="heart">♥</div>
      <div class="heart">♥</div>
      <div class="heart">♥</div>
      <div class="heart">♥</div>
      <div class="heart">♥</div>
      <div class="heart">♥</div>
      <div class="heart">♥</div>
    </div>

    <div class="sparkles-container">
      <div class="sparkle">✨</div>
      <div class="sparkle">✨</div>
      <div class="sparkle">✨</div>
      <div class="sparkle">✨</div>
      <div class="sparkle">✨</div>
      <div class="sparkle">✨</div>
    </div>

    <div class="container">
      <div class="rose-container">
        <div class="stem"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>
        <div class="leaf"></div>

        <div class="rose-bloom">
          <div class="petal petal-1"></div>
          <div class="petal petal-2"></div>
          <div class="petal petal-3"></div>
          <div class="petal petal-4"></div>
          <div class="petal petal-5"></div>
          <div class="petal petal-6"></div>
          <div class="petal petal-inner petal-7"></div>
          <div class="petal petal-inner petal-8"></div>
          <div class="petal petal-inner petal-9"></div>
          <div class="petal petal-inner petal-10"></div>
          <div class="petal petal-core petal-11"></div>
          <div class="petal petal-core petal-12"></div>
          <div class="center"></div>
        </div>
      </div>

      <div class="romantic-text">
        My Sophie,<br />
        Like this rose,<br />
        my love for you blooms<br />
        more beautiful each day
      </div>
      <div class="subtitle">Forever yours ♥<br />Ayomi❤️</div>
    </div>

    <script>
      // Prevent scrolling
      document.addEventListener('scroll', function (e) {
        e.preventDefault();
        window.scrollTo(0, 0);
      });

      document.addEventListener(
        'wheel',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      document.addEventListener(
        'touchmove',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );

      // Enhanced interactive sparkles
      const sparkleEmojis = ['✨', '💫', '⭐', '🌟', '💖', '💕'];
      const sparkleColors = [
        '#ff8fab',
        '#ffc2d4',
        '#ffacc1',
        '#fff',
        '#ff6b9d',
      ];

      document.addEventListener('click', function (e) {
        // Create multiple sparkles for each click
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const sparkle = document.createElement('div');
            sparkle.innerHTML =
              sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
            sparkle.className = 'click-sparkle';

            // Random position around click
            const offsetX = (Math.random() - 0.5) * 60;
            const offsetY = (Math.random() - 0.5) * 60;

            sparkle.style.left = e.clientX + offsetX - 12 + 'px';
            sparkle.style.top = e.clientY + offsetY - 12 + 'px';
            sparkle.style.color =
              sparkleColors[Math.floor(Math.random() * sparkleColors.length)];

            document.body.appendChild(sparkle);

            setTimeout(() => {
              if (sparkle.parentNode) {
                sparkle.remove();
              }
            }, 1500);
          }, i * 100);
        }
      });

      // Restart animation on double-click
      document.addEventListener('dblclick', function (e) {
        e.preventDefault();
        location.reload();
      });

      // Ensure page stays at top
      window.addEventListener('load', function () {
        window.scrollTo(0, 0);
      });

      // Add some magic - random sparkles around the rose
      setInterval(() => {
        if (Math.random() < 0.3) {
          // 30% chance every interval
          const magicSparkle = document.createElement('div');
          magicSparkle.innerHTML = '✨';
          magicSparkle.className = 'click-sparkle';

          // Position around the rose area
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;
          const radius = 150 + Math.random() * 100;
          const angle = Math.random() * Math.PI * 2;

          magicSparkle.style.left =
            centerX + Math.cos(angle) * radius - 12 + 'px';
          magicSparkle.style.top =
            centerY + Math.sin(angle) * radius - 12 + 'px';
          magicSparkle.style.color =
            sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
          magicSparkle.style.fontSize = 12 + Math.random() * 8 + 'px';

          document.body.appendChild(magicSparkle);

          setTimeout(() => {
            if (magicSparkle.parentNode) {
              magicSparkle.remove();
            }
          }, 1500);
        }
      }, 2000);
    </script>
  </body>
</html>
